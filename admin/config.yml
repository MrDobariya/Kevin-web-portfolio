backend:
  name: git-gateway
  branch: main

local_backend: false

site_url: https://portfolio.kevindobariya.online
display_url: https://portfolio.kevindobariya.online

logo_url: /favicon.svg

media_folder: "images"
public_folder: "/images"

collections:
  - name: "blog"
    label: "Blog"
    folder: "blog"
    create: true
    slug: "{{slug}}"
    format: "frontmatter"
    extension: "md"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
      - label: "Content"
        name: "body"
        widget: "markdown"
      - label: "External Link"
        name: "link"
        widget: "string"
        required: false
