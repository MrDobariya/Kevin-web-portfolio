<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="cyber" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c8ff"></stop>
      <stop offset="100%" stop-color="#0085ff"></stop>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="64" height="64" rx="12" fill="#020812"></rect>

  <!-- Outer scan ring -->
  <circle cx="32" cy="32" r="26" stroke="rgba(0,200,255,0.25)" stroke-width="1" fill="none"></circle>

  <!-- Shield -->
  <path d="M32 12 L48 20 L48 34 C48 44 40 52 32 56 C24 52 16 44 16 34 L16 20 Z" fill="none" stroke="url(#cyber)" stroke-width="2.2"></path>

  <!-- Lock -->
  <rect x="26" y="30" width="12" height="10" rx="2" fill="none" stroke="#00ffe0" stroke-width="2"></rect>

  <path d="M28 30 L28 26 C28 22 36 22 36 26 L36 30" fill="none" stroke="#00ffe0" stroke-width="2"></path>

  <!-- Center dot (threat monitor feel) -->
  <circle cx="32" cy="35" r="1.5" fill="#00c8ff"></circle>
</svg>